<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="title desc">
  <title id="title">New York State editorial map</title>
  <desc id="desc">A dark editorial map treatment with Central New York highlighted.</desc>
