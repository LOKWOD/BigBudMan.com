name: Deploy Big Bud Man to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore publication source
        run: |
          cat source/bbm-tools.xz.part-* > /tmp/bbm-tools.tar.xz
          tar -xJf /tmp/bbm-tools.tar.xz
          mkdir -p assets/images
          cat source/og-card.part-* > assets/images/og-card.png
      - name: Build publication
        run: python tools/build_site.py
      - name: Audit publication
        run: python tools/audit_site.py _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
